<title>Step Challenge Total</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@450;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Expedition dashboard: navy ink and ocean blue on a cool ground, one quiet card,
   mono for labels and measurements, sans for everything read as prose. */
:root{
  --ink:#0e1c2b; --muted:#56687a; --faint:#8395a6;
  --line:#e4eaf1; --card:#fff; --bg:#f4f7fa; --track:#e7edf3;
  --accent:#1364c4; --accent-dark:#0f55a8; --accent-soft:#eaf2fc;
  --sea:#d9e8f6; --sea2:#bdd7ee; --land:#b3c3d1; --landline:#99aec0;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased}
.lbl{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase}
.wrap{max-width:900px;margin:0 auto;padding-block:22px;padding-left:16px;padding-right:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 26px 20px;
  box-shadow:0 1px 2px rgba(14,28,43,.04),0 10px 28px rgba(14,28,43,.05)}

.top{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--line);padding-bottom:15px}
h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.012em}
.route{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.updated{font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.01em}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#2fa36b;
  margin-right:6px;vertical-align:middle}
.dot.stale{background:#d0a132}
@media(prefers-reduced-motion:no-preference){.dot{animation:pulse 2.6s ease-in-out infinite}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;padding:20px 0 2px;
  align-items:center}
.dist{font-size:clamp(42px,7.5vw,64px);font-weight:700;line-height:1;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;max-width:100%;overflow-wrap:anywhere}
.dist.long{font-size:clamp(26px,5vw,44px)}   /* an absurd total must not burst the card */
.unit{font-size:clamp(17px,2.6vw,22px);font-weight:500;color:var(--muted);margin-left:8px;
  letter-spacing:-.01em}
.caption{margin:10px 0 0;color:var(--muted);font-size:14.5px}
.caption b{color:var(--ink);font-weight:600}

.bar{position:relative;height:10px;background:var(--track);border-radius:999px;margin:20px 0 0;
  overflow:hidden}
.fill{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--accent),#3a9ad9);
  transition:width 1.1s cubic-bezier(.22,1,.36,1)}
.tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.7)}
.ends{display:flex;justify-content:space-between;gap:12px;margin:8px 0 0;color:var(--muted);
  font-size:12.5px}

.next{margin:22px 0 0;padding:13px 16px;border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:10px;background:var(--accent-soft)}
.next .lbl{color:var(--accent);display:block}
.next .city{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em;margin-top:3px}
.next .togo{display:block;color:var(--muted);font-size:13.5px;margin-top:1px}

.globebox{position:relative}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab;
  filter:drop-shadow(0 12px 22px rgba(14,28,43,.15))}
canvas.drag{cursor:grabbing}
.hint{margin:12px 0 0;text-align:center;color:var(--faint);font-size:12px;min-height:16px}
.recentre{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0;
  text-decoration:underline}
.recentre:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:24px 0 0}
.tile{background:var(--card);padding:13px 15px;min-width:0}
.tile b{display:block;font-size:19px;font-weight:600;letter-spacing:-.015em;
  font-variant-numeric:tabular-nums}
.tile span{display:block;margin-top:4px;color:var(--faint);font-family:var(--mono);font-weight:500;
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}

.stopsbox{margin:24px 0 0;border-top:1px solid var(--line);padding-top:16px}
.stopshead{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline;
  margin-bottom:8px}
.stopshead h2{margin:0;color:var(--faint);font-family:var(--mono);font-weight:500;font-size:10.5px;
  letter-spacing:.09em;text-transform:uppercase}
.stops{list-style:none;margin:0;padding:0;columns:3;column-gap:28px}
.stops li{break-inside:avoid;display:flex;align-items:center;gap:9px;padding:4px 0;font-size:13.5px;
  color:var(--faint)}
.stops li.done{color:var(--ink)}
.stops li.now{color:var(--ink);font-weight:600}
.pin{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--track);background:#fff;flex:none}
.done .pin{background:var(--accent);border-color:var(--accent)}
.now .pin{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stops .km{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.done .km{color:var(--muted)}

footer{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  margin:20px 0 0;border-top:1px solid var(--line);padding-top:16px}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;
  font-size:14px;padding:9px 18px;border-radius:8px}
.btn:hover{background:var(--accent-dark)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.foot{color:var(--faint);font-size:12px}
.note{margin:16px 0 0;padding:12px 15px;border-radius:10px;font-size:14px;
  background:#fdf6e3;border:1px solid #eadfbc;color:#6b5618}
.note code{background:#fff;border:1px solid #e8dcb4;border-radius:5px;padding:1px 5px;
  font-family:var(--mono);font-size:12.5px}
.hide{display:none}
@media(max-width:760px){
  .cols{grid-template-columns:1fr;gap:20px}
  .globebox{max-width:330px;margin:0 auto}
  .stops{columns:2}
}
@media(max-width:430px){.card{padding:18px 16px 14px}.stops{columns:1}}
</style>

<div class="wrap"><div class="card">
  <div class="top">
    <div>
      <h1 id="title">Step Challenge</h1>
      <p class="route" id="route"></p>
    </div>
    <span class="updated" id="updated"></span>
  </div>

  <div class="cols">
    <div>
      <div class="dist"><span id="dist">0</span><span class="unit" id="unit">miles</span></div>
      <p class="caption" id="caption">Adding up everyone's steps…</p>

      <div class="bar"><div class="fill" id="fill"></div><div id="ticks"></div></div>
      <div class="ends"><span id="start"></span><span id="target"></span></div>

      <div class="next" id="next" aria-live="polite"></div>
    </div>

    <div class="globebox">
      <canvas id="globe" width="340" height="340" role="img" aria-label="Globe showing how far the team has walked"></canvas>
      <p class="hint" id="hint"></p>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="stopsbox">
    <div class="stopshead">
      <h2>Stops along the way</h2>
      <span class="updated" id="stopcount"></span>
    </div>
    <ul class="stops" id="stops"></ul>
  </div>

  <div class="note hide" id="note"></div>

  <footer>
    <a class="btn hide" id="formlink" target="_blank" rel="noopener">Add your steps</a>
    <span class="foot">Totals refresh automatically</span>
  </footer>
</div></div>

<noscript><p style="text-align:center">This page needs JavaScript to add up the step totals.</p></noscript>

<script>
/* ===== EDIT THIS BLOCK — nothing below it needs changing ===== */
const CONFIG = {
  title:        "Our Step Challenge",
  csvUrl:       "https://docs.google.com/spreadsheets/d/e/2PACX-1vS5_MenPFou2ty_MrYZ1MqP2CpyJKQR5gg7Z2olRDrUMv1MWH_XJeprLgdDOf1zwjc7q6J6dWnWfRvZ/pub?gid=608922422&single=true&output=csv",
  formUrl:      "https://docs.google.com/forms/d/e/1FAIpQLSe_9wMPTO3fwYoF7UtQZUuw7bD-IFymCognFlLOf3rW1ieg_Q/viewform",
  stepsHeader:  "",       // "" = use the column whose heading mentions "steps"
  nameHeader:   "",       // "" = use the column whose heading mentions "name"
  stepsPerMile: 2000,
  units:        "miles",  // "miles" or "km"
  target:       0,        // 0 = the finish line is the last stop below
  refreshSeconds: 45,     // how often it re-reads the sheet (Google's own cache adds a few minutes)
  maxStepsPerEntry: 200000, // one entry above this is ignored as a typo (0 = count everything)
  // One lap of the planet, heading east and ending where it started.
  // Add, remove or reorder stops — the distances work themselves out.
  journey: [
    ["Edinburgh",       55.9533,   -3.1883],
    ["London",          51.5074,   -0.1278],
    ["Paris",           48.8566,    2.3522],
    ["Athens",          37.9838,   23.7275],
    ["Cairo",           30.0444,   31.2357],
    ["Dubai",           25.2048,   55.2708],
    ["Mumbai",          19.0760,   72.8777],
    ["Singapore",        1.3521,  103.8198],
    ["Jakarta",         -6.2088,  106.8456],
    ["Sydney",         -33.8688,  151.2093],
    ["Auckland",       -36.8485,  174.7633],
    ["Honolulu",        21.3069, -157.8583],
    ["San Francisco",   37.7749, -122.4194],
    ["Chicago",         41.8781,  -87.6298],
    ["New York",        40.7128,  -74.0060],
    ["Reykjavik",       64.1466,  -21.9426],
    ["Edinburgh (home)", 55.9533,  -3.1883]
  ]
};
/* ============================================================= */

const $ = id => document.getElementById(id);
const RAD = Math.PI / 180;
const fmt = (n, d = 0) => n.toLocaleString(undefined, {minimumFractionDigits: d, maximumFractionDigits: d});
const perUnit = () => CONFIG.units === "km" ? CONFIG.stepsPerMile / 1.609344 : CONFIG.stepsPerMile;
const fromKm = km => CONFIG.units === "km" ? km : km / 1.609344;

/* ---------- reading the sheet ---------- */

function parseCSV(text){
  const rows = []; let row = [], field = "", quoted = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (quoted){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else quoted = false; }
      else field += c;
    }
    else if (c === '"') quoted = true;
    else if (c === ','){ row.push(field); field = ""; }
    else if (c === '\n'){ row.push(field); field = ""; rows.push(row); row = []; }
    else if (c !== '\r') field += c;
  }
  if (field !== "" || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function findCol(headers, explicit, words){
  const clean = h => String(h == null ? "" : h).trim().toLowerCase();
  if (explicit){
    const i = headers.findIndex(h => clean(h) === clean(explicit));
    if (i >= 0) return i;
  }
  return headers.findIndex(h => words.some(w => clean(h).includes(w)));
}

function totals(table){
  const si = findCol(table.headers, CONFIG.stepsHeader, ["step"]);
  if (si < 0) throw new Error("no column heading mentions “steps”");
  const ni = findCol(table.headers, CONFIG.nameHeader, ["name", "walker", "who"]);
  let steps = 0, entries = 0, ignored = 0;
  const people = new Set();
  const cap = CONFIG.maxStepsPerEntry;
  table.rows.forEach(r => {
    const v = Number(String(r[si] == null ? "" : r[si]).replace(/[^0-9.\-]/g, ""));
    if (!isFinite(v) || v <= 0) return;
    // A single impossible figure would otherwise finish the journey on its own.
    if (cap > 0 && v > cap){ ignored++; return; }
    steps += v; entries++;
    if (ni >= 0){
      const n = String(r[ni] == null ? "" : r[ni]).trim().toLowerCase();
      if (n) people.add(n);
    }
  });
  return {steps, entries, ignored, walkers: people.size || entries, named: ni >= 0};
}

function loadCsv(){
  const url = CONFIG.csvUrl + (CONFIG.csvUrl.includes("?") ? "&" : "?") + "_=" + Date.now();
  return fetch(url).then(r => {
    if (!r.ok) throw new Error("the sheet link returned " + r.status);
    return r.text();
  }).then(text => {
    const rows = parseCSV(text);
    return {headers: rows.shift() || [], rows};
  });
}

/* ---------- the journey ---------- */

const vec = (lat, lon) => {
  const a = lon * RAD, b = lat * RAD, c = Math.cos(b);
  return [c * Math.sin(a), Math.sin(b), c * Math.cos(a)];
};

function slerp(v1, v2, t){
  let dot = Math.max(-1, Math.min(1, v1[0]*v2[0] + v1[1]*v2[1] + v1[2]*v2[2]));
  const o = Math.acos(dot);
  if (o < 1e-6) return v1;
  const s = Math.sin(o), a = Math.sin((1-t)*o)/s, b = Math.sin(t*o)/s;
  return [v1[0]*a + v2[0]*b, v1[1]*a + v2[1]*b, v1[2]*a + v2[2]*b];
}

const toLatLon = v => {
  const m = Math.hypot(v[0], v[1], v[2]);
  return [Math.asin(v[1]/m) / RAD, Math.atan2(v[0], v[2]) / RAD];
};

const gcKm = (a, b) => {
  const v1 = vec(a[1], a[2]), v2 = vec(b[1], b[2]);
  const dot = Math.max(-1, Math.min(1, v1[0]*v2[0] + v1[1]*v2[1] + v1[2]*v2[2]));
  return Math.acos(dot) * 6371;
};

const STOPS = CONFIG.journey.map(c => ({name: c[0], lat: c[1], lon: c[2]}));
(function measure(){
  let at = 0;
  STOPS.forEach((s, i) => {
    if (i) at += fromKm(gcKm(CONFIG.journey[i-1], CONFIG.journey[i]));
    s.at = at;
  });
})();
const JOURNEY_END = STOPS.length ? STOPS[STOPS.length - 1].at : 0;
const finishLine = () => CONFIG.target > 0 ? CONFIG.target : JOURNEY_END;

// Where the walkers have reached, as [lat, lon], plus the stop they are heading for.
function positionAt(dist){
  if (!STOPS.length) return {pos: null, nextIndex: -1, doneCount: 0};
  if (dist <= 0) return {pos: [STOPS[0].lat, STOPS[0].lon], nextIndex: 1, doneCount: 1};
  for (let i = 1; i < STOPS.length; i++){
    if (dist < STOPS[i].at){
      const a = STOPS[i-1], b = STOPS[i];
      const t = (dist - a.at) / Math.max(1e-9, b.at - a.at);
      return {pos: toLatLon(slerp(vec(a.lat, a.lon), vec(b.lat, b.lon), t)), nextIndex: i, doneCount: i};
    }
  }
  const last = STOPS[STOPS.length - 1];
  return {pos: [last.lat, last.lon], nextIndex: -1, doneCount: STOPS.length};
}

// The route as a dense line of [lat, lon] points, each tagged with distance travelled.
function routePoints(){
  const out = [];
  for (let i = 1; i < STOPS.length; i++){
    const a = STOPS[i-1], b = STOPS[i];
    const v1 = vec(a.lat, a.lon), v2 = vec(b.lat, b.lon);
    const steps = Math.max(8, Math.round((b.at - a.at) / 40));
    for (let s = (i === 1 ? 0 : 1); s <= steps; s++){
      const t = s / steps;
      out.push({ll: toLatLon(slerp(v1, v2, t)), at: a.at + (b.at - a.at) * t});
    }
  }
  return out;
}
const ROUTE = routePoints();

/* ---------- the globe ---------- */

const globe = {
  cv: $("globe"), ctx: null, R: 0, cx: 0, cy: 0,
  yaw: 0, pitch: 20, land: null, spinning: true, dragging: false, walked: 0, here: null,

  init(){
    this.ctx = this.cv.getContext("2d");
    this.resize();
    addEventListener("resize", () => { this.resize(); this.draw(); });

    let lastX = 0, lastY = 0;
    this.cv.addEventListener("pointerdown", e => {
      this.dragging = true; this.spinning = false; lastX = e.clientX; lastY = e.clientY;
      this.cv.classList.add("drag"); this.cv.setPointerCapture(e.pointerId);
    });
    this.cv.addEventListener("pointermove", e => {
      if (!this.dragging){ this.hover(e); return; }
      this.yaw -= (e.clientX - lastX) * 0.35;
      this.pitch = Math.max(-85, Math.min(85, this.pitch + (e.clientY - lastY) * 0.35));
      lastX = e.clientX; lastY = e.clientY;
      this.draw();
    });
    const stop = e => {
      if (!this.dragging) return;
      this.dragging = false; this.cv.classList.remove("drag");
      if (e.pointerId != null && this.cv.hasPointerCapture(e.pointerId)) this.cv.releasePointerCapture(e.pointerId);
    };
    this.cv.addEventListener("pointerup", stop);
    this.cv.addEventListener("pointercancel", stop);
    this.cv.addEventListener("pointerleave", () => { if (!this.dragging) this.hint(""); });
    this.cv.addEventListener("dblclick", () => this.centre());

    try { this.land = decodeTopo(LAND_TOPO, "land"); }
    catch(e){ this.land = null; console.warn("globe: couldn't read the map data", e); }

    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) this.spin();
    this.draw();
  },

  resize(){
    const box = this.cv.parentElement.getBoundingClientRect();
    const size = Math.max(240, Math.min(340, box.width || 340));
    const dpr = Math.min(2, devicePixelRatio || 1);
    this.cv.width = size * dpr; this.cv.height = size * dpr;
    this.cv.style.height = size + "px";
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cx = size / 2; this.cy = size / 2; this.R = size / 2 - 6;
  },

  spin(){
    const frame = () => {
      if (this.spinning && !this.dragging){ this.yaw += 0.12; this.draw(); }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  },

  // Tilt less than the walkers' latitude, or a northern route ends up squashed against the limb.
  lookAt(ll){
    this.yaw = ll[1];
    this.pitch = Math.max(-45, Math.min(45, ll[0] * 0.55));
  },

  centre(){
    if (!this.here) return;
    this.spinning = false;
    this.lookAt(this.here);
    this.draw();
  },

  project(lat, lon){
    const v = vec(lat, lon);
    const cy = Math.cos(this.yaw * RAD), sy = Math.sin(this.yaw * RAD);
    const x1 = v[0]*cy - v[2]*sy, z1 = v[0]*sy + v[2]*cy;
    const cp = Math.cos(this.pitch * RAD), sp = Math.sin(this.pitch * RAD);
    const y2 = v[1]*cp - z1*sp, z2 = v[1]*sp + z1*cp;
    let x = x1, y = y2;
    if (z2 <= 0){ const m = Math.hypot(x1, y2) || 1e-6; x = x1/m; y = y2/m; }
    return {x: this.cx + this.R * x, y: this.cy - this.R * y, vis: z2 > 0};
  },

  hover(e){
    const r = this.cv.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    let found = null;
    STOPS.forEach(s => {
      const p = this.project(s.lat, s.lon);
      if (p.vis && Math.hypot(p.x - mx, p.y - my) < 11) found = s;
    });
    this.hint(found ? found.name + " · " + fmt(found.at) + " " + CONFIG.units + " in" : "");
  },

  hint(text){
    $("hint").innerHTML = text ? text
      : 'Drag to spin · <button class="recentre" id="rc">centre on the walkers</button>';
    const rc = $("rc");
    if (rc) rc.onclick = () => this.centre();
  },

  line(points, colour, width, dash){
    const c = this.ctx;
    c.save(); c.strokeStyle = colour; c.lineWidth = width; c.lineCap = "round"; c.lineJoin = "round";
    if (dash) c.setLineDash(dash);
    c.beginPath();
    let pen = false;
    points.forEach(ll => {
      const p = this.project(ll[0], ll[1]);
      if (!p.vis){ pen = false; return; }
      if (pen) c.lineTo(p.x, p.y); else { c.moveTo(p.x, p.y); pen = true; }
    });
    c.stroke(); c.restore();
  },

  draw(){
    const c = this.ctx, R = this.R;
    if (!c) return;
    c.clearRect(0, 0, this.cx * 2, this.cy * 2);

    // Atmosphere: a soft halo just outside the sphere, so the edge glows instead of stopping dead.
    const air = c.createRadialGradient(this.cx, this.cy, R * .97, this.cx, this.cy, R * 1.09);
    air.addColorStop(0, "rgba(96,156,214,.30)");
    air.addColorStop(.5, "rgba(96,156,214,.12)");
    air.addColorStop(1, "rgba(96,156,214,0)");
    c.beginPath(); c.arc(this.cx, this.cy, R * 1.09, 0, 7); c.fillStyle = air; c.fill();

    // Ocean, lit from the upper left.
    const g = c.createRadialGradient(this.cx - R*.38, this.cy - R*.42, R*.05, this.cx, this.cy, R*1.04);
    g.addColorStop(0, "#f2f9ff");
    g.addColorStop(.35, getCSS("--sea"));
    g.addColorStop(.78, getCSS("--sea2"));
    g.addColorStop(1, "#9dc0e0");
    c.beginPath(); c.arc(this.cx, this.cy, R, 0, 7); c.fillStyle = g; c.fill();

    c.save(); c.beginPath(); c.arc(this.cx, this.cy, R, 0, 7); c.clip();

    for (let lat = -60; lat <= 60; lat += 30){
      const pts = []; for (let lon = -180; lon <= 180; lon += 3) pts.push([lat, lon]);
      this.line(pts, "rgba(255,255,255,.55)", .8);
    }
    for (let lon = -180; lon < 180; lon += 30){
      const pts = []; for (let lat = -88; lat <= 88; lat += 3) pts.push([lat, lon]);
      this.line(pts, "rgba(255,255,255,.55)", .8);
    }

    if (this.land){
      // Land sits slightly proud of the water: lit at the top, darker at the bottom, soft shadow.
      const lg = c.createLinearGradient(0, this.cy - R, 0, this.cy + R);
      lg.addColorStop(0, "#c6d4e0");
      lg.addColorStop(.45, getCSS("--land"));
      lg.addColorStop(1, "#9db0c0");
      c.save();
      c.fillStyle = lg;
      c.strokeStyle = getCSS("--landline"); c.lineWidth = .6;
      c.shadowColor = "rgba(10,28,48,.28)"; c.shadowBlur = 4; c.shadowOffsetY = 1;
      this.land.forEach(poly => poly.forEach(ring => {
        let visible = false;
        c.beginPath();
        ring.forEach((pt, i) => {
          const p = this.project(pt[1], pt[0]);
          if (p.vis) visible = true;
          if (i) c.lineTo(p.x, p.y); else c.moveTo(p.x, p.y);
        });
        c.closePath();
        if (visible){ c.fill(); c.shadowColor = "transparent"; c.stroke();
                      c.shadowColor = "rgba(10,28,48,.28)"; }
      }));
      c.restore();
    }

    const walkedPts = [], restPts = [];
    ROUTE.forEach(p => { (p.at <= this.walked ? walkedPts : restPts).push(p.ll); });
    if (walkedPts.length && restPts.length) restPts.unshift(walkedPts[walkedPts.length - 1]);
    this.line(restPts, "rgba(21,32,43,.26)", 1.8, [2.5, 4]);

    c.save();
    // A wide soft pass under the crisp line gives the walked route some lift off the surface.
    c.shadowColor = "rgba(19,100,196,.55)"; c.shadowBlur = 10;
    this.line(walkedPts, "rgba(19,100,196,.35)", 6);
    c.shadowBlur = 6;
    this.line(walkedPts, getCSS("--accent"), 3.2);
    c.shadowColor = "transparent";
    this.line(walkedPts, "rgba(255,255,255,.45)", 1);
    c.restore();

    const heading = positionAt(this.walked).nextIndex;
    STOPS.forEach((s, i) => {
      const p = this.project(s.lat, s.lon);
      if (!p.vis) return;
      const done = s.at <= this.walked;
      c.beginPath(); c.arc(p.x, p.y, done ? 3.4 : 2.8, 0, 7);
      c.fillStyle = done ? getCSS("--accent") : "#fff";
      c.strokeStyle = done ? "#fff" : "rgba(14,28,43,.45)";
      c.lineWidth = 1.5; c.fill(); c.stroke();
      // Only the stop just reached and the one being walked to, so labels never pile up.
      if (heading < 0 ? i === STOPS.length - 1 : (i === heading || i === heading - 1)){
        const dy = i === heading - 1 ? -7 : 12;   // reached stop above its dot, next one below
        c.font = '600 11px "IBM Plex Sans",-apple-system,Segoe UI,Roboto,Arial,sans-serif';
        c.lineWidth = 3; c.strokeStyle = "rgba(255,255,255,.95)"; c.fillStyle = getCSS("--ink");
        c.strokeText(s.name, p.x + 7, p.y + dy); c.fillText(s.name, p.x + 7, p.y + dy);
      }
    });

    if (this.here){
      const p = this.project(this.here[0], this.here[1]);
      if (p.vis){
        c.beginPath(); c.arc(p.x, p.y, 7.5, 0, 7); c.fillStyle = "rgba(19,100,196,.22)"; c.fill();
        c.beginPath(); c.arc(p.x, p.y, 4, 0, 7); c.fillStyle = getCSS("--accent");
        c.strokeStyle = "#fff"; c.lineWidth = 2; c.fill(); c.stroke();
      }
    }

    // Limb darkening, then a specular highlight: the two cues that read as "sphere" not "disc".
    const limb = c.createRadialGradient(this.cx, this.cy, R * .55, this.cx, this.cy, R);
    limb.addColorStop(0, "rgba(10,30,60,0)");
    limb.addColorStop(.82, "rgba(10,30,60,.07)");
    limb.addColorStop(1, "rgba(8,26,54,.28)");
    c.beginPath(); c.arc(this.cx, this.cy, R, 0, 7); c.fillStyle = limb; c.fill();

    const shine = c.createRadialGradient(this.cx - R*.42, this.cy - R*.46, 0,
                                         this.cx - R*.42, this.cy - R*.46, R*.75);
    shine.addColorStop(0, "rgba(255,255,255,.30)");
    shine.addColorStop(1, "rgba(255,255,255,0)");
    c.beginPath(); c.arc(this.cx, this.cy, R, 0, 7); c.fillStyle = shine; c.fill();

    c.restore();

    c.beginPath(); c.arc(this.cx, this.cy, R - .5, 0, 7);
    c.strokeStyle = "rgba(255,255,255,.5)"; c.lineWidth = 1; c.stroke();
    c.beginPath(); c.arc(this.cx, this.cy, R, 0, 7);
    c.strokeStyle = "rgba(21,45,78,.22)"; c.lineWidth = 1; c.stroke();
  },

  setProgress(dist, autoCentre){
    this.walked = dist;
    this.here = positionAt(dist).pos;
    if (autoCentre && this.here && this.spinning) this.lookAt(this.here);
    this.draw();
  }
};

const getCSS = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// world-atlas ships TopoJSON: quantised, delta-encoded arcs.
function decodeTopo(topo, name){
  const [sx, sy] = topo.transform.scale, [tx, ty] = topo.transform.translate;
  const arcs = topo.arcs.map(arc => {
    let x = 0, y = 0;
    return arc.map(d => { x += d[0]; y += d[1]; return [x * sx + tx, y * sy + ty]; });
  });
  const ring = idx => {
    const pts = [];
    idx.forEach(i => {
      const rev = i < 0, a = arcs[rev ? ~i : i], seg = rev ? a.slice().reverse() : a;
      pts.push.apply(pts, pts.length ? seg.slice(1) : seg);
    });
    return pts;
  };
  const o = topo.objects[name];
  const geoms = o.type === "GeometryCollection" ? o.geometries : [o];
  const polys = [];
  geoms.forEach(g => {
    if (g.type === "MultiPolygon") g.arcs.forEach(p => polys.push(p));
    else if (g.type === "Polygon") polys.push(g.arcs);
  });
  return polys.map(poly => poly.map(ring));
}

/* ---------- putting it on the page ---------- */

function animate(el, to, places){
  const from = Number(el.dataset.v || 0);
  el.dataset.v = to;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur = reduced ? 0 : 900, t0 = performance.now();
  (function step(t){
    const p = dur ? Math.min(1, (t - t0) / dur) : 1;
    el.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - p, 3)), places);
    if (p < 1) requestAnimationFrame(step);
  })(performance.now());
}

function note(html){ $("note").innerHTML = html; $("note").classList.remove("hide"); }

function renderStops(dist){
  const {nextIndex} = positionAt(dist);
  const reached = STOPS.filter(s => s.at <= dist).length;
  $("stops").innerHTML = STOPS.map((s, i) => {
    const cls = s.at <= dist ? "done" : i === nextIndex ? "now" : "";
    return '<li class="' + cls + '"><span class="pin"></span>' + s.name +
           '<span class="km">' + fmt(s.at) + '</span></li>';
  }).join("");
  $("stopcount").textContent = reached + " of " + STOPS.length + " reached";

  if (nextIndex < 0){
    $("next").innerHTML = '<span class="lbl">Journey complete</span>' +
      '<span class="city">' + (LOOP ? "All the way round" : STOPS[STOPS.length - 1].name) + '</span>' +
      '<span class="togo">' + (LOOP
        ? "Back where we started, " + fmt(JOURNEY_END) + " " + CONFIG.units + " later"
        : "Every stop on the route is behind us") + '</span>';
  } else {
    const s = STOPS[nextIndex];
    $("next").innerHTML = '<span class="lbl">Next stop</span>' +
      '<span class="city">' + s.name + '</span>' +
      '<span class="togo">' + fmt(s.at - dist, 1) + " " + CONFIG.units + ' to go</span>';
  }
}

function render(t){
  const dist = t.steps / perUnit();
  const goal = finishLine();
  const pct = goal > 0 ? dist / goal * 100 : 0;
  const left = goal - dist;

  animate($("dist"), dist, 1);
  $("dist").parentElement.classList.toggle("long", fmt(dist, 1).length > 12);
  $("caption").innerHTML = left > 0
    ? "<b>" + fmt(pct, pct > 0 && pct < 10 ? 1 : 0) + "%</b> of the way · " +
      fmt(left, 1) + " " + CONFIG.units + " still to walk"
    : "<b>Finished</b> · " + fmt(-left, 1) + " " + CONFIG.units + " past the end";
  $("fill").style.width = Math.max(pct > 0 ? 1.5 : 0, Math.min(100, pct)) + "%";

  $("stats").innerHTML = [
    ["Steps logged", fmt(t.steps)],
    [t.named ? "Walkers" : "People", fmt(t.walkers)],
    ["Entries", fmt(t.entries)],
    ["Average each", t.walkers ? fmt(t.steps / t.walkers / perUnit(), 1) + " " + CONFIG.units : "—"]
  ].map(p => '<div class="tile"><b>' + p[1] + '</b><span>' + p[0] + '</span></div>').join("");

  renderStops(dist);
  globe.setProgress(dist, true);
}

// The figures currently on screen, so a poll that brings nothing new leaves the page alone
// instead of re-animating every number.
let shown = null, shownAt = "";

function stamp(text, stale){
  $("updated").innerHTML = '<i class="dot' + (stale ? ' stale' : '') + '"></i>' + text;
}

const clockTime = () => new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});

function load(){
  if (!CONFIG.csvUrl){
    $("caption").textContent = "Waiting to be connected to the form";
    note("<b>One step left.</b> Publish the form's responses sheet " +
         "(File › Share › Publish to web › CSV) and paste the link into " +
         "<code>csvUrl</code> near the top of this file.");
    return;
  }
  loadCsv()
    .then(table => {
      const t = totals(table);
      const changed = !shown || t.steps !== shown.steps || t.walkers !== shown.walkers ||
                      t.entries !== shown.entries || t.ignored !== shown.ignored;
      if (changed){ shown = t; render(t); }
      if (t.ignored){
        note("<b>" + fmt(t.ignored) + (t.ignored === 1 ? " entry is" : " entries are") +
             " not counted</b> — over " + fmt(CONFIG.maxStepsPerEntry) +
             " steps in one go, which is almost always a typo. Correct the row in the sheet " +
             "and it will count within a minute.");
      } else {
        $("note").classList.add("hide");
      }
      shownAt = clockTime();
      stamp("Updated " + shownAt);
    })
    .catch(err => {
      // Once there are figures on screen, a failed poll must not wipe them out.
      if (shown){ stamp("Last updated " + shownAt + " · retrying", true); return; }
      $("caption").textContent = "Couldn't read the latest totals";
      note("<b>No totals yet:</b> " + err.message + ". The page keeps trying.");
    });
}

$("title").textContent = CONFIG.title;
document.title = CONFIG.title;
$("unit").textContent = CONFIG.units;
const LAST = STOPS.length ? STOPS[STOPS.length - 1] : null;
// A route that finishes where it began is a lap of the planet, and reads better said that way.
const LOOP = !!LAST && STOPS.length > 2 &&
  Math.abs(LAST.lat - STOPS[0].lat) < 0.5 && Math.abs(LAST.lon - STOPS[0].lon) < 0.5;
$("route").textContent = LAST
  ? (LOOP ? "Once around the world from " + STOPS[0].name
          : STOPS[0].name + " → " + LAST.name) +
    " · " + fmt(finishLine()) + " " + CONFIG.units
  : "";
$("start").textContent = STOPS.length ? STOPS[0].name : "0";
$("target").textContent = LAST ? (LOOP ? "Home" : LAST.name) : fmt(finishLine()) + " " + CONFIG.units;
$("ticks").innerHTML = STOPS.slice(1, -1).map(s =>
  '<i class="tick" style="left:' + (s.at / Math.max(1, finishLine()) * 100).toFixed(2) + '%"></i>').join("");
if (CONFIG.formUrl){ $("formlink").href = CONFIG.formUrl; $("formlink").classList.remove("hide"); }
globe.init();
globe.hint("");
renderStops(0);
globe.setProgress(0, true);
load();
setInterval(load, Math.max(15, CONFIG.refreshSeconds) * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
